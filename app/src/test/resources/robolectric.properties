# Robolectric configuration for JVM unit tests.
#
# sdk=33: Robolectric 4.10.3 ships android-all images up to API 33 only, and it refuses to
# run when the merged manifest's targetSdkVersion is newer than that.
#
# application=android.app.Application: the real BlokPApplication calls
# System.loadLibrary("sqlcipher") in onCreate, which cannot succeed on the JVM. Tests that
# need the app's real behaviour should exercise it explicitly rather than have every
# Robolectric test die in Application.onCreate.
sdk=33
application=android.app.Application
