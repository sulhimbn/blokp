plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
    id 'com.google.dagger.hilt.android'
}

// Robolectric downloads its android-all runtime itself, which breaks in hermetic or
// TLS-intercepted CI. Resolving the artifact through Gradle and running Robolectric
// offline keeps the android-all runtime a first-class, cached dependency.
configurations {
    robolectricAndroidAll
}
def robolectricJarsDir = layout.buildDirectory.dir("robolectric-deps")

dependencies {
    robolectricAndroidAll "org.robolectric:android-all-instrumented:14-robolectric-10818077-i4"
}

tasks.register('resolveRobolectricAndroidAll', Sync) {
    from configurations.robolectricAndroidAll
    into robolectricJarsDir
}

tasks.withType(Test).configureEach {
    dependsOn 'resolveRobolectricAndroidAll'
}

android {
    namespace 'com.example.iurankomplek'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.blokp"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // API Configuration - default spreadsheet ID
        buildConfigField "String", "API_SPREADSHEET_ID", "\"QjX6hB1ST2IDKaxB\""
        
        // Webhook secret - MUST be injected via -PwebhookSecret=, WEBHOOK_SECRET env var,
        // or local.properties. Empty means webhook verification fails closed.
        def localPropertiesFile = rootProject.file('local.properties')
        def localProperties = new Properties()
        if (localPropertiesFile.exists()) {
            localPropertiesFile.withInputStream { localProperties.load(it) }
        }
        def webhookSecret = project.findProperty('webhookSecret') ?:
                System.getenv('WEBHOOK_SECRET') ?:
                localProperties.getProperty('WEBHOOK_SECRET', '')
        buildConfigField "String", "WEBHOOK_SECRET", "\"${webhookSecret}\""
    }
    buildTypes {
        debug {
            testCoverageEnabled true
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
    testOptions {
        unitTests {
            includeAndroidResources true
            returnDefaultValues true
            all {
                systemProperty 'robolectric.offline', 'true'
                systemProperty 'robolectric.dependency.dir', robolectricJarsDir.get().asFile.absolutePath
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }
    lint {
        abortOnError false
        checkReleaseBuilds true
        htmlReport true
        xmlReport true
        warningsAsErrors false
        enable 'StopShip'
        disable 'InvalidPackage', 'PrivateResource', 'GradleOverrides'
        lintConfig file('src/main/res/xml/lint.xml')
    }

}

dependencies {

     implementation libs.androidx.core.ktx
     implementation libs.androidx.appcompat
     implementation libs.material
     implementation libs.androidx.constraintlayout
     implementation libs.androidx.swiperefreshlayout
    
    // Testing dependencies
    testImplementation libs.junit
    testImplementation libs.mockito.core
    testImplementation libs.mockito.kotlin
    testImplementation libs.arch.core.testing
    testImplementation libs.kotlinx.coroutines.test
    testImplementation libs.robolectric
    testImplementation libs.androidx.test.core
    testImplementation libs.hilt.android.testing
    testImplementation libs.mockwebserver
    
    androidTestImplementation libs.androidx.test.ext.junit
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.espresso.contrib
    androidTestImplementation libs.androidx.test.runner
    androidTestImplementation libs.androidx.test.rules
    androidTestImplementation libs.mockwebserver
    androidTestImplementation libs.androidx.test.core
    androidTestImplementation libs.hilt.android.testing
    androidTestImplementation libs.mockito.core
    androidTestImplementation libs.mockito.kotlin
    kspAndroidTest libs.hilt.android.compiler
    
    implementation libs.androidx.recyclerview
    implementation libs.glide

    implementation libs.gson

    implementation libs.retrofit
    implementation libs.retrofit.converter.gson

    implementation libs.okhttp3.logging.interceptor
    debugImplementation libs.chucker
    
    // Room database
    implementation libs.room.runtime
    implementation libs.room.ktx
    ksp libs.room.compiler
    
    // SQLCipher for database encryption
    implementation libs.sqlcipher

    
    // Hilt for dependency injection
    implementation libs.hilt.android
    ksp libs.hilt.android.compiler
    kspTest libs.hilt.android.compiler

    // Encrypted SharedPreferences for secure session storage
    implementation libs.security.crypto
    
    // Coroutines
    implementation libs.kotlinx.coroutines.android
    
    // Lifecycle
    implementation libs.androidx.fragment.ktx
    implementation libs.androidx.activity.ktx
    implementation libs.lifecycle.runtime.ktx
    implementation libs.lifecycle.viewmodel.ktx
    implementation libs.lifecycle.livedata.ktx
    
    // PDF Export - iText for Android
    implementation libs.itextpdf
    
    // CSV Export - Apache Commons CSV
    implementation libs.apache.commons.csv
}
