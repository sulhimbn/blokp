plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
    id 'com.google.dagger.hilt.android'
}

android {
    namespace 'com.example.iurankomplek'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.blokp"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // API Configuration - default spreadsheet ID
        buildConfigField "String", "API_SPREADSHEET_ID", "\"QjX6hB1ST2IDKaxB\""
        
        // Webhook secret - MUST be set via CI/CD secrets for production
        // In debug builds, uses placeholder value from Constants.kt if not configured
        buildConfigField "String", "WEBHOOK_SECRET", "\"\""

        // Debug builds talk to the local mock API over an adb reverse tunnel:
        // adb reverse tcp:5000 tcp:5000
        buildConfigField "String", "MOCK_API_URL", "\"http://127.0.0.1:5000/data/QjX6hB1ST2IDKaxB/\""
    }
    buildTypes {
        debug {
            testCoverageEnabled true
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
    testOptions {
        unitTests {
            // Production code calls android.util.Log from plain JVM unit tests
            // (CacheManager, repositories), which throws "not mocked" without this.
            returnDefaultValues = true
            // Robolectric needs merged resources to inflate layouts.
            includeAndroidResources = true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
        // ReceiptGenerator uses java.time, which needs API 26; desugaring keeps
        // minSdk 24 working.
        coreLibraryDesugaringEnabled true
    }
    kotlinOptions {
        jvmTarget = '11'
    }
    lint {
        abortOnError false
        checkReleaseBuilds true
        htmlReport true
        xmlReport true
        warningsAsErrors false
        enable 'StopShip'
        disable 'InvalidPackage', 'PrivateResource', 'GradleOverrides'
        lintConfig file('src/main/res/xml/lint.xml')
    }

}

dependencies {
    coreLibraryDesugaring(libs.desugar.jdk.libs)


     implementation libs.androidx.core.ktx
     implementation libs.androidx.appcompat
     implementation libs.material
     implementation libs.androidx.constraintlayout
     implementation libs.androidx.swiperefreshlayout
    
    // Testing dependencies
    testImplementation libs.junit
    testImplementation libs.mockito.core
    testImplementation libs.mockito.kotlin
    testImplementation libs.arch.core.testing
    testImplementation libs.kotlinx.coroutines.test
    testImplementation libs.robolectric
    testImplementation libs.mockwebserver
    
    androidTestImplementation libs.androidx.test.ext.junit
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.espresso.contrib
    androidTestImplementation libs.androidx.test.runner
    androidTestImplementation libs.androidx.test.rules
    androidTestImplementation libs.mockwebserver
    
    implementation libs.androidx.recyclerview
    implementation libs.glide

    implementation libs.gson

    implementation libs.retrofit
    implementation libs.retrofit.converter.gson

    implementation libs.okhttp3.logging.interceptor
    debugImplementation libs.chucker
    
    // Room database
    implementation libs.room.runtime
    implementation libs.room.ktx
    ksp libs.room.compiler
    
    // SQLCipher for database encryption
    implementation libs.sqlcipher

    
    // Hilt for dependency injection
    implementation libs.hilt.android
    ksp libs.hilt.android.compiler

    // Encrypted SharedPreferences for secure session storage
    implementation libs.security.crypto
    
    // Coroutines
    implementation libs.kotlinx.coroutines.android
    
    // Lifecycle
    implementation libs.androidx.fragment.ktx
    implementation libs.androidx.activity.ktx
    implementation libs.lifecycle.runtime.ktx
    implementation libs.lifecycle.viewmodel.ktx
    implementation libs.lifecycle.livedata.ktx
    
    // PDF Export - iText for Android
    implementation libs.itextpdf
    
    // CSV Export - Apache Commons CSV
    implementation libs.apache.commons.csv
}
