name: build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and unit test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # No android-actions/setup-android here: v3 shells out to `sdkmanager tools`,
      # and Google removed that package from the command-line tools repository, so it
      # exits 1 on current runners before any build runs. GitHub's ubuntu-latest image
      # already ships the Android SDK and sdkmanager on PATH; we only add the packages
      # this project pins.
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Assemble debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Run unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest