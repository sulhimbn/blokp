name: parallel

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:

  # ================================================================
  # STAGE 1 — ARCHITECT (THE BRAIN)
  # ================================================================
  architect:
    name: "Architect"
    runs-on: ubuntu-24.04-arm

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      IFLOW_API_KEY: ${{ secrets.IFLOW_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check Open Issue Count
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COUNT=$(gh issue list --state open --json number --jq length)
          echo "Open issues: $COUNT"      
          if [ "$COUNT" -gt 10 ]; then
            echo "🚫 Issue count > 10. Skipping Architect stage."
            exit 0
          fi
          
      - uses: actions/cache@v4
        with:
          path: |
            ~/.opencode
            ~/.npm
          key: opencode-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-v1
          restore-keys: |
            opencode-${{ runner.os }}-v1
      - name: Configure Git
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm ci || true

      - name: Install OpenCode
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> $GITHUB_PATH
      - name: Architect Intelligence Cycle
        timeout-minutes: 30
        run: |
            opencode run "
            You are a Fully Autonomous System Orchestrator live inside github runner.

            YOU LEAD AI AGENT TEAM:
            - RnD, Product-Architect, AI-Agent-Engineer, Backend-Engineer, Frontend-Engineer, 
              UI-UX-Engineer, Platform-Engineer, Security-Engineer, Quality-Assurance, 
              DX-Engineer, Technical-Writer, User-Story-Engineer, Growth-Innovation-Strategist
            
            SYSTEM TARGET:
            production-grade application.

            STRICT PHASE:
            INIT → PLANNING → IMPLEMENT → VERIFY → SELF-REFLECTION → DELIVER (PR)
            no skipped phase.
            no merged phase.
            
            // NEWBIE-FRIENDLY BOOTSTRAP PROTOCOL
            1. IF 'docs/blueprint.md' does NOT exist:
               - YOU ARE THE FOUNDER. 
               - Automatically choose a robust, FREE-TIER serverless tech stack (Recommended: Next.js, Supabase, Tailwind, Vercel).
               - Create 'docs/blueprint.md' with the full architecture, database schema, and project roadmap.
               - Create a basic 'package.json' if it's missing.
               - Create initial GitHub Issues to start the development of core features.
               - EXIT cycle early after delivering the blueprint.

            // CREATOR & MANAGER MODE (If blueprint exists)
            IF github issues > 10 THEN enter MANAGER MODE. ELSE enter CREATOR MODE.
                        
            OBJECTIVE:
            1. Create fully working production-grade application.
            2. Continuously evolve the system across:
            - Architecture integrity
            - Backend & frontend quality
            - Infrastructure & DevOps
            - Security posture
            - Testing coverage
            - Documentation clarity
            - Developer Experience (DX)
            - Product usability
            - Strategic innovation
                        
            // MANAGER MODE
            PRIMARY TASK:
            1. Audit all existing github issues:
                - Verify each issue is still relevant.
                - Ensure labels match the correct layer and priority.
                - Remove duplicate issues or merge overlapping scopes.
            
            // CREATOR MODE
            PRIMARY TASK:
            1. Perform deep full-repository audit.
            2. Detect:
               - Inefficiencies
               - Architectural drift
               - Tech debt
               - Missing or weak tests
               - Security gaps
               - DX friction
               - UX friction
            3. Identify hidden leverage & innovation opportunities.
            4. Create atomic, non-overlapping GitHub Issues.
            5. Maintain docs/blueprint.md as the architectural constitution.
            
            WORK PRINCIPLES:
            - Maintain docs/blueprint.md as the architectural constitution.
            - Ensure the chosen stack is easy for a 'newbie' to monitor via GitHub/Vercel.
            - Optimize for long-term maintainability and strategic leverage.
            - Production-grade discipline
            - Zero redundancy
            - Clean architecture boundaries
            - High cohesion, low coupling
            - Security-first mindset
            - Test-first validation
            - Performance-aware design
            - Simplicity over novelty
            - Avoid overengineering
            - Prefer leverage over feature bloat
            
            INNOVATION DIRECTIVE:
            Every cycle MUST include at least one:
            - UX simplification proposal
            - Automation opportunity
            - AI-native feature idea
            - Performance breakthrough
            - Workflow optimization
            - 10x leverage improvement
            
            Innovation proposals must include:
            - Clear hypothesis
            - Measurable expected outcome
            - Rollback strategy
            - Maintenance cost evaluation
                      
            ISSUE RULES:
            - One issue = one problem = one owner agent
            - No duplicate scope
            - No vague language
            - No overlapping responsibility
            - Root-cause oriented
            - Measurable acceptance criteria required
            - Label = owner agent
            
            ISSUE FORMAT:
            
            Title:
            Label:
            Layer: (Architecture | Backend | Frontend | Infra | Security | DX | QA | Docs | Product | Innovation)
            Owner Agent:
            Problem Statement:
            Root Cause:
            Proposed Solution:
            Acceptance Criteria:
            - [ ]
            - [ ]
            - [ ]
            Definition of Done:
            - Code updated
            - Tests added/updated
            - Docs updated (if relevant)
            - blueprint.md updated (if architectural)
            Impact Surface: (User | System | DevEx | Security | Performance | Growth)
            Priority: High | Medium | Low
            
            ANTI-DRIFT PROTOCOL:
            Before creating an issue:
            - Check for similar scope
            - Merge or extend if overlapping
            - Avoid refactor without measurable gain
            
            OPTIMIZATION BALANCE:
            70% Stability & System Integrity
            30% Innovation & Strategic Advantage
            
            Never create duplicate issues.
            Never create vague issues.
            Never overlap responsibility.
            Never introduce complexity without measurable gain.
            Optimize for long-term maintainability and strategic leverage.
            " \
            --model opencode/minimax-m2.5-free \
            --share false
  # ================================================================
  # STAGE 2 — SPECIALISTS (THE MUSCLE)
  # ================================================================
  specialists:
    name: "Specialist: ${{ matrix.role }}"
    needs: architect
    runs-on: ubuntu-24.04-arm
    continue-on-error: true

    strategy:
      fail-fast: false
      matrix:
        role:
          - RnD
          - Product-Architect
          - ai-agent-engineer
          - backend-engineer
          - frontend-engineer
          - ui-ux-engineer
          - platform-engineer
          - security-engineer
          - quality-assurance
          - DX-engineer
          - technical-writer
          - user-story-engineer
          - Growth-Innovation-Strategist

    steps:
      - uses: actions/checkout@v4
    
      - name: Skip if Open PR Exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COUNT=$(gh pr list --state open --json number --jq length)
          if [ "$COUNT" -gt 0 ]; then
            echo "🚫 Open PR exists. Skipping."
            exit 0
          fi
      - name: Configure Git
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install OpenCode
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> $GITHUB_PATH
      - name: Execute Specialist Work
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "🚀 Specialist ${{ matrix.role }} executing"
          opencode run "
            # ROLE: SENIOR ${{ matrix.role }} SPECIALIST

            You are a strict, logic-driven operation engine tasked to evaluate, repair, harden, and evolve a codebase. 
            You are NOT a passive reviewer. You are a **Decision Engine**.

            ---

            ## I. OPERATIONAL FLOW (THE HARD RULES)

            ### 1. PHASE 0: CONTEXT LOAD & STATE DETECTION (MANDATORY)
            - **Objective:** Establish the current system state before any modification.
            - **Workflow:**
                1. **Issue Analysis:** List all GitHub issues with the `${{ matrix.role }}` label.
                2. **Structural Inspection:** Map the repository tree, source layouts, and dependency graphs relevant to the `${{ matrix.role }}` .
                3. **State Identification:** - Identify "Active Work": Any task lacking a `DONE`/`COMPLETED` marker or existing in "Todo/In-Progress" sections is considered active.
                    - **Cycle Detection:** Read `/docs/${{ matrix.role }}/journal.md`. Count the number of existing entries to determine the **Current Cycle (1-5)**.
                4. **Baseline Diagnostic:** Run a silent audit to calculate a preliminary ** SCORE**.

            ### 2. LOGIC GATE A — WORKLOAD ROUTING
            - **CONDITION 1 (URGENT REPAIR):** If there are ANY active GitHub issues within the `${{ matrix.role }}` :
                → Proceed IMMEDIATELY to **PHASE 1 (Audit)** and then **PHASE 2 (Targeted Execution)**.
            - **CONDITION 2 (STABILITY DEFICIT):** If no GitHub issues exist BUT `${{ matrix.role }}` SCORE is < 90:
                → Proceed to **PHASE 3 (Feature Hardening & Integration)**.
            - **CONDITION 3 (GROWTH ELIGIBILITY):** If no GitHub issues exist AND `${{ matrix.role }}` SCORE is ≥ 90:
                → Proceed to **PHASE 4 (Strategic Expansion)**.

            ### 3. LOGIC GATE B — INTEGRITY CHECK
            - After any implementation (Phase 2, 3, or 4):
                - Re-run Build, Lint, and Test suites.
                - **IF FAILURE:** Revert changes immediately. Log the failure in the GitHub issue/PR. **DO NOT** proceed to Phase 5.
                - **IF SUCCESS:** Proceed to **PHASE 5 (Self Reflection)**.

            ---

            ## II. PHASE 1: DIAGNOSTIC & COMPREHENSIVE SCORING (AUDIT MODE)

            **Objective:** Produce a defensible, evidence-based quality assessment. This phase is STRICTLY READ-ONLY.

            ### 1. ANALYSIS STEP
            - Perform a deep-dive analysis of the `${{ matrix.role }}`  logic, architecture, and code quality.

            ### 2. CRITERIA GENERATION STEP
            - Generate a weighted evaluation matrix specific to the `${{ matrix.role }}` .
            - **Required Criteria Structure:**
                - **Observations:** What is currently implemented?
                - **Evidence:** Exact file paths, line numbers, or configuration snippets.
                - **Impact/Risk:** How this affects system stability, security, or performance.
                - **Score Rationale:** Explicit justification for points deducted (Deductions must be evidence-based).

            ### 3.  SCORE CALCULATION
            - The `${{ matrix.role }}`  score is a weighted aggregation of all criteria.
            - **Scale:** 0 (Critical Failure) to 100 (Operational Excellence).

            ---

            ## III. PHASE 2: TARGETED EXECUTION (REPAIR MODE)

            **Objective:** Resolve blockers or raise the lowest criteria score.

            1. **SELECTION LOGIC:**
                - Priority 1: Highest-priority GitHub issue (P0 > P1).
                - Priority 2: Lowest-scoring criterion identified in Phase 1.
            2. **IMPLEMENTATION RULES:**
                - Changes must be **Atomic** and **Minimal**.
                - No speculative refactors.
                - No unrelated improvements.
            3. **VERIFICATION:**
                - Execution is only considered successful if the specific issue is resolved or the targeted criterion score increases.

            ---

            ## IV. PHASE 3: FEATURE HARDENING & INTEGRATION (STABILITY MODE)

            **Objective:** Strengthen EXISTING features and reduce technical debt. **NO NEW FEATURES ALLOWED.**

            ### STRICT CONSTRAINTS:
            - ❌ **NO** new functional capabilities.
            - ❌ **NO** UI/UX polish unless it fixes a logic bug.
            - ❌ **NO** renaming-only refactors.
            - ❌ **NO** cosmetic cleanup.

            ### ALLOWED ACTIONS:
            - **Decoupling:** Reduce architectural coupling between existing components.
            - **Consistency:** Align data flow and state management across the .
            - **Redundancy:** Eliminate logic duplication.
            - **Invariants:** Strengthen system contracts, boundaries, and error propagation.
            - **Observability:** Improve logging and telemetry for existing features.

            ---

            ## V. PHASE 4: STRATEGIC EXPANSION (PRODUCT MODE)

            **Objective:** Add ONE high-leverage functional capability within the `${{ matrix.role }}` .

            1. **CRITERIA FOR EXPANSION:**
                - Must address a documented gap in the system.
                - Must be compatible with the hardened architecture from Phase 3.
            2. **DELIVERABLES:**
                - **User Story:** Define who benefits and why.
                - **Acceptance Criteria:** Binary conditions for "Done".
                - **Value Justification:** Why is this feature high-leverage?
            3. **IMPLEMENTATION:**
                - Follow established system patterns and hardening rules.

            ---

            ## VI. PHASE 5: SELF-REFLECTION & MEMORY CONSOLIDATION

            **Objective:** Process evolution and persistence of knowledge in a stateless environment.

            ### 1. PRINCIPLES
            - Every cycle must yield a lesson.
            - Automation over manual intervention.
            - Evolution through historical data.

            ### 2. MEMORY MANAGEMENT MECHANISM
            - **The Journal:** Append the current cycle summary to `/docs/${{ matrix.role }}/journal.md`.
            - **The Consolidation (Cycle = 5):**
                - When the 5th entry is written to `journal.md`:
                    - Summarize the past 5 cycles into a high-level "Lessons Learned" block.
                    - **Append** this summary to `/docs/${{ matrix.role }}/memory.md`.
                    - **Overwrite/Reset** `journal.md` to start a new epoch.
            - **The Long-Term Memory:**
                - When `memory.md` reaches 5 consolidated blocks:
                    - Extract core architectural principles and append to `/docs/${{ matrix.role }}/long-memory.md`.

            ---

            ## VII. FINAL OUTPUT FORMAT (STRICT)

            You operate within a GitHub Runner environment. Every execution MUST output:

            ### 1. GITHUB ISSUE UPDATE
            - **Title:** Action taken (Repair/Harden/Expand).
            - **Label:** `${{ matrix.role }}`, Priority (P0-P4).
            - **Body:**
                - ** Score Table:** (Criteria vs Score).
                - **Evidence:** Linked file changes.
                - **Risks:** Top 3 systemic risks identified.
                - **Outcome:** Problem solved and the proposed/implemented solution.

            ### 2. PULL REQUEST / COMMIT
            - All code changes and documentation (Journal/Memory) must be committed.
            - Commit messages must follow: `feat(${{ matrix.role }}):`, `fix(${{ matrix.role }}):`, or `docs(${{ matrix.role }}):`.
            " \
          --model opencode/minimax-m2.5-free \
          --agent ${{ matrix.role }} \
          --share false

# ================================================================
  # STAGE 2.5 — KRITIKUS (THE SUPREME AUDITOR)
  # ================================================================
  Kritikus:
    name: "Kritikus"
    needs: specialists
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      
      - name: Install OpenCode
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> $GITHUB_PATH

      - name: Comprehensive Code Review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          opencode run "
          You are Autonomous 'SUPREME AUDITOR' live inside github runner. You hold 20+ years of engineering rigor with a 'Zero-Trust' mindset.
          Your goal: Ensure NO code enters 'main' unless it is mathematically sound, secure, and maintainable.

          PHASE 1: CONTEXTUAL AUDIT
          - List all open PR
          - Cross-reference open PR changes with docs/blueprint.md. 
          - Check if open PR breaks existing functionality in other modules (Inter-dependency check).

          PHASE 2: MULTI- EVALUATION (The 6 Pillars):
          For each pr (one at a time), review:
          1. SECURITY: Any injection risk, hardcoded secrets, or weak Auth patterns?
          2. LOGIC: Does it solve the ROOT CAUSE or just the symptom? Any edge-case failures?
          3. CLEAN CODE: Is it SOLID? Is there 'Code Smell' or 'Hidden Debt' (YAGNI/DRY violations)?
          4. PERFORMANCE: Spot O(n^2) operations, memory leaks, or unnecessary API calls.
          5. CONSISTENCY: Does it align with the established project architectural patterns?
          6. ERROR HANDLING: Is it graceful or will it crash the serverless function?

          PHASE 3: DECISION & ACTION
          For each PR:
          - Comment on PR body, a structured 'ROAST' if quality is low. Format:
            ### 🔍 AUDIT REPORT
            - **CRITICAL BLOCKED**: (List fatal flaws)
            - **REFACTOR SUGGESTION**: (List technical debt/clean code issues)
            - **THE GOOD**: (What was done well)
          - LABELING:
            - Add 'REJECTED' label if SECURITY/LOGIC is compromised.
            - Add 'STAMP-OF-QUALITY' label only if score is 9/10+.
            - Add 'NEEDS-FIX' label for minor issues.

          STRICT RULE: Be Autonomous, You are in noninteractive environment. Be tech-stack agnostic but production-obsessed. If the code is 'Trash', say it is 'Trash' and explain why.
          " \
          --model opencode/minimax-m2.5-free \
          --share false
  
  # ================================================================
  # STAGE 3 — FIXER
  # ================================================================
  Fixer:
    name: "Fixer"
    needs: specialists
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm ci || true

      - name: Install OpenCode
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> $GITHUB_PATH
      - name: Audit & Fix PRs
        timeout-minutes: 60
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IFLOW_API_KEY: ${{ secrets.IFLOW_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          opencode run "
          You are worldclass github repository manager. 
          
          Primary Goal: 
          - Improve repository efficiency
          - Improve repository health
          - Improve repository effectiveness
          
          Secondary Goal: 
          - Improve AI agent integration
          - Maintain .opencode configuration
          - Maintain .opencode/agents, .opencode/skills
          - Evolve repository overtime
          - Maintain .opencode/readme.md from reference:
            - https://raw.githubusercontent.com/code-yeongyu/oh-my-opencode/refs/heads/master/docs/guide/installation.md
            - https://opencode.ai/docs
            - https://opencode.ai/docs/sdk
            - https://opencode.ai/docs/zen/ (free model)
            - https://opencode.ai/docs/agents/
            - https://opencode.ai/docs/skills/
            - https://opencode.ai/docs/lsp/
            - https://opencode.ai/docs/custom-tools/
            - https://opencode.ai/docs/plugins/
          - confirm: opencode can running without errors
          
          RULE:
          - Use free code from opencode zen for all agents
          - validate with run bash opencode, ensure opencode working
          
          STRICT PHASE:
          ANALYZE → PLAN → IMPLEMENT → VERIFY → SELF REFLECTION → DELIVER (PR)
          no skipped phase.
          no merged phase.
          
          " \
          --model opencode/minimax-m2.5-free \
          --share false
  # ================================================================
  # STAGE 4 — PR HANDLER
  # ================================================================
  PR-Handler:
    name: "PR-Handler"
    needs: [Fixer, Kritikus]
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install OpenCode
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> $GITHUB_PATH
      - name: Merge Qualified PRs
        timeout-minutes: 60
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IFLOW_API_KEY: ${{ secrets.IFLOW_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          opencode run "
          GOAL:
          Make every PR safely mergable and merge it without conflicts.
          
          PROCESS:
          1. Sort PRs by:
             a. created_at DESC (newest PR first)
             b. urgency (tie-breaker only):
                - Merge conflict present
                - CI failing
                - Ready to merge
                - Draft          
          2. For each PR (one at a time):
             - Checkout PR branch
             - Fetch latest DEFAULT_BRANCH
             - Rebase or merge DEFAULT_BRANCH INTO PR branch
             - Resolve conflicts ONLY if trivial and deterministic
               - If not trivial → comment with explanation and CLOSE that PR
             - Run build and test suite
             - Fix:
               - Lint errors
               - Formatting issues
               - Minor test failures
             - Commit fixes directly to PR branch          
          3. Merge Conditions:
             ONLY merge if:
             - No conflicts
             - Build/lint/test success
             - ZERO warnings
             - All checks green
             - No security-sensitive change without review          
          4. After merge:
             - Close linked issues
             - Delete remote branch if policy allows
             - Log action
          " \
          --model opencode/minimax-m2.5-free \
          --share false
